<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lance Spearman — Chapter 1</title><style>
body{margin:0;background:#08111c;color:white;font:15px system-ui;overflow:hidden}#hud{position:fixed;top:12px;left:12px;background:#091522dd;border:1px solid #50617b;padding:16px;border-radius:12px;max-width:340px;z-index:2}#hud h2{margin:0 0 8px;color:#e8c778}#objective{line-height:1.5}#hint{font-size:12px;color:#b6c6d9;margin-top:10px}#message{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#101d2de8;padding:12px 24px;border-radius:12px;z-index:2}#buttons{position:fixed;right:14px;bottom:14px;display:flex;gap:8px;z-index:3}button{background:#e8c778;border:0;border-radius:8px;padding:12px;font-weight:700;cursor:pointer}#start{position:fixed;inset:0;display:grid;place-items:center;background:#07101cee;z-index:5}#start section{max-width:550px;padding:32px;text-align:center}#start h1{font-size:36px;color:#e8c778}#start p{line-height:1.6}
</style></head><body><div id="start"><section><h1>LANCE SPEARMAN</h1><h2>Chapter 1: The Courier Conspiracy</h2><p>Seven connected third-person 3D missions. Explore Nairobi, find evidence, evade patrols, rescue the informant, and stop Victor Kane.</p><p>WASD / arrows: move · Shift: sprint · E: interact · Space: evade · Mouse drag: rotate camera</p><button id="play">Begin Mission</button></section></div><div id="hud"><h2 id="level"></h2><div id="objective"></div><div id="hint"></div></div><div id="message"></div><div id="buttons"><button id="interact">Interact (E)</button><button id="evade">Evade</button><button id="reset">Restart level</button></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const missions=[
{name:'Arrival at the Market',task:'Find and question the contact',goal:'Contact',count:1,zone:'market'},
{name:'The Suspicious Package',task:'Collect two coded receipts while avoiding patrols',goal:'Receipt',count:2,zone:'market'},
{name:'Taxi Stand Pursuit',task:'Intercept three courier checkpoints',goal:'Checkpoint',count:3,zone:'taxi'},
{name:'Warehouse Shadows',task:'Disable two cameras and rescue the informant',goal:'Camera / Informant',count:3,zone:'warehouse'},
{name:'The Encrypted Ledger',task:'Recover three intelligence fragments',goal:'Ledger',count:3,zone:'warehouse'},
{name:"Kane's Security Compound",task:'Disable three signal jammers',goal:'Jammer',count:3,zone:'compound'},
{name:'Victor Kane: Final Confrontation',task:'Disarm three security relays, then confront Kane',goal:'Relay / Kane',count:4,zone:'compound'}];
let level=Number(localStorage.getItem('lance-level')||0);level=Math.max(0,Math.min(6,level));
const scene=new THREE.Scene();scene.background=new THREE.Color('#7d9da8');scene.fog=new THREE.Fog('#7d9da8',40,135);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,200);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x4e5368,2));const sun=new THREE.DirectionalLight(0xffedc4,2);sun.position.set(25,40,10);scene.add(sun);
const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.82});const ground=new THREE.Mesh(new THREE.PlaneGeometry(180,180),mat('#687c68'));ground.rotation.x=-Math.PI/2;scene.add(ground);
function box(x,y,z,w,h,d,color){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color));o.position.set(x,y,z);scene.add(o);return o}
for(let i=-3;i<=3;i++)for(let j=-3;j<=3;j++){if(Math.abs(i)<2&&Math.abs(j)<2)continue;let x=i*18,z=j*18;box(x,3,z,11,6+(Math.abs(i*j)%4)*2,11,['#b89e83','#c1b6a1','#82939b'][Math.abs(i+j+12)%3]);}
for(let i=-4;i<=4;i++){box(i*15,.07,0,7,.12,1,'#c8ba83');box(0,.07,i*15,1,.12,7,'#c8ba83')}
const player=new THREE.Group();const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.55,1.15,5,9),mat('#233449'));torso.position.y=1.35;player.add(torso);const head=new THREE.Mesh(new THREE.SphereGeometry(.39,12,10),mat('#654632'));head.position.y=2.38;player.add(head);scene.add(player);
const keys={};let targets=[],guards=[],progress=0,invuln=0,camAngle=0,active=false,notice='';
function marker(x,z,label,color){const g=new THREE.Group();const base=new THREE.Mesh(new THREE.CylinderGeometry(.7,.7,.15,16),mat(color));base.position.y=.2;g.add(base);const orb=new THREE.Mesh(new THREE.OctahedronGeometry(.5),new THREE.MeshStandardMaterial({color,emissive:color,emissiveIntensity:.65}));orb.position.y=1.6;g.add(orb);g.position.set(x,0,z);scene.add(g);return {g,label};}
function clear(){targets.forEach(t=>scene.remove(t.g));guards.forEach(g=>scene.remove(g.g));targets=[];guards=[];progress=0;player.position.set(0,0,10);}
function load(){clear();const m=missions[level];const areas={market:[-10,-8],taxi:[18,-7],warehouse:[-14,20],compound:[20,22]};const [bx,bz]=areas[m.zone];for(let i=0;i<m.count;i++){const last=level===6&&i===3;const label=last?'Kane':level===3&&i===2?'Informant':m.goal.split(' / ')[0];targets.push(marker(bx+(i%2)*7,bz+Math.floor(i/2)*8,label,last?'#f24848':'#e8c778'));}
for(let i=0;i<level+2;i++){let a=i*2.4;const g=marker(bx+Math.cos(a)*14,bz+Math.sin(a)*14,'Guard','#e64b54');guards.push({...g,angle:a,origin:new THREE.Vector3(g.g.position.x,0,g.g.position.z)});}
document.getElementById('level').textContent='Chapter 1 · Level '+(level+1)+'/7 — '+m.name;update();}
function update(){const m=missions[level];document.getElementById('objective').textContent=m.task+' ('+progress+'/'+m.count+')';document.getElementById('hint').textContent='Gold markers = objectives. Red markers = patrols. Move close and press E. Progress saves automatically.';document.getElementById('message').textContent=notice;}
function interact(){if(!active)return;let best=null,dist=3.4;for(const t of targets){const d=t.g.position.distanceTo(player.position);if(d<dist){best=t;dist=d;}}if(!best){notice='Move closer to a gold objective.';update();return;}if(level===6&&best.label==='Kane'&&progress<3){notice='Disable the three relays first!';update();return;}scene.remove(best.g);targets=targets.filter(t=>t!==best);progress++;notice=best.label+' secured!';if(progress>=missions[level].count){if(level<6){level++;localStorage.setItem('lance-level',level);notice='Mission complete! Next level unlocked.';load();}else{localStorage.setItem('lance-level',0);notice='VICTORY! Victor Kane defeated. Chapter 1 complete. Replay from Level 1 with Restart.';active=false;}}update();}
function evade(){invuln=2;notice='Evade activated';update();}
document.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='e')interact();if(e.code==='Space')evade();});document.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let dragging=false,oldX=0;renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;oldX=e.clientX});window.addEventListener('pointerup',()=>dragging=false);window.addEventListener('pointermove',e=>{if(dragging){camAngle+=(e.clientX-oldX)*.005;oldX=e.clientX;}});
document.getElementById('play').onclick=()=>{document.getElementById('start').style.display='none';active=true;notice='Find the gold objective marker.';load();};document.getElementById('interact').onclick=interact;document.getElementById('evade').onclick=evade;document.getElementById('reset').onclick=()=>{active=true;notice='Level restarted';load();};
const clock=new THREE.Clock();function frame(){requestAnimationFrame(frame);const dt=Math.min(.05,clock.getDelta());if(active){let dx=Number(!!(keys.d||keys.arrowright))-Number(!!(keys.a||keys.arrowleft));let dz=Number(!!(keys.s||keys.arrowdown))-Number(!!(keys.w||keys.arrowup));const len=Math.hypot(dx,dz)||1;const speed=keys.shift?10:6;const vx=(dx*Math.cos(camAngle)+dz*Math.sin(camAngle))/len,vz=(dz*Math.cos(camAngle)-dx*Math.sin(camAngle))/len;player.position.x=THREE.MathUtils.clamp(player.position.x+vx*speed*dt,-75,75);player.position.z=THREE.MathUtils.clamp(player.position.z+vz*speed*dt,-75,75);if(dx||dz)player.rotation.y=Math.atan2(vx,vz);invuln=Math.max(0,invuln-dt);
guards.forEach(g=>{g.angle+=dt*(.35+level*.07);g.g.position.set(g.origin.x+Math.cos(g.angle)*3,0,g.origin.z+Math.sin(g.angle)*3);if(invuln===0&&g.g.position.distanceTo(player.position)<2){player.position.set(0,0,10);notice='Patrol spotted you! Return to cover.';invuln=2;update();}});targets.forEach(t=>t.g.children[1].rotation.y+=dt*1.5);}
const offset=new THREE.Vector3(Math.sin(camAngle)*-10,7,Math.cos(camAngle)*10);camera.position.lerp(player.position.clone().add(offset),.12);camera.lookAt(player.position.x,1.4,player.position.z);renderer.render(scene,camera);}frame();window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
